spring:
  application:
    name: dongneai-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # 스키마는 Flyway가 관리
    properties:
      hibernate:
        jdbc.time_zone: Asia/Seoul
        default_batch_fetch_size: 100
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: always
  servlet:
    multipart:
      enabled: false   # 이미지는 presigned URL로 스토리지에 직접 업로드

server:
  port: 8080
  shutdown: graceful

app:
  kakao:
    rest-api-key: ${KAKAO_REST_API_KEY:}   # 비어 있으면 장소 검색(external-search)만 503
    base-url: https://dapi.kakao.com
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl: 30m
    refresh-token-ttl: 30d

management:
  endpoints:
    web:
      exposure:
        include: health
